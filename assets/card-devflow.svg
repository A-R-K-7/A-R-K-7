<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-label="DevFlow - Developer Operations and Deployment Tracking Dashboard">
  <defs>
    <style>
      .bg     { fill: #0D1117; }
      .tb     { fill: #161B22; }
      .border { fill: none; stroke: #30363D; stroke-width: 1; }
      .dr     { fill: #FF5F56; }
      .dy     { fill: #FFBD2E; }
      .dg     { fill: #27C93F; }
      .ttl    { fill: #6E7681; font-family:'Courier New',monospace; font-size:11px; }
      .tag    { fill: #7EE787; font-family:'Courier New',monospace; font-size:10px; font-weight:bold; }
      .name   { fill: #F0F6FC; font-family:'Courier New',monospace; font-size:15px; font-weight:bold; letter-spacing:1px; }
      .desc   { fill: #8B949E; font-family:'Courier New',monospace; font-size:11px; }
      .key    { fill: #58A6FF; font-family:'Courier New',monospace; font-size:11px; }
      .val    { fill: #8B949E; font-family:'Courier New',monospace; font-size:11px; }
      .stack  { fill: #6E7681; font-family:'Courier New',monospace; font-size:10px; }
      .grn    { fill: #7EE787; font-family:'Courier New',monospace; font-size:11px; }
      .cur    { fill: #7EE787; }
      .blink  { animation: blink 1s step-end infinite; }
      .l1  { opacity:0; animation: fi .2s .4s forwards; }
      .l2  { opacity:0; animation: fi .2s .7s forwards; }
      .l3  { opacity:0; animation: fi .2s 1.0s forwards; }
      .l4  { opacity:0; animation: fi .2s 1.3s forwards; }
      .l5  { opacity:0; animation: fi .2s 1.6s forwards; }
      .l6  { opacity:0; animation: fi .2s 1.9s forwards; }
      .l7  { opacity:0; animation: fi .2s 2.2s forwards; }
      @keyframes fi    { from{opacity:0;} to{opacity:1;} }
      @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
    </style>
    <linearGradient id="tagBg3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="419" height="239" rx="7" class="bg"/>
  <rect x=".5" y=".5" width="419" height="239" rx="7" class="border"/>
  <rect x="1" y="1" width="418" height="30" rx="6" class="tb"/>
  <rect x="1" y="22" width="418" height="9"  class="tb"/>
  <circle cx="18" cy="16" r="5" class="dr"/>
  <circle cx="34" cy="16" r="5" class="dy"/>
  <circle cx="50" cy="16" r="5" class="dg"/>
  <text x="210" y="20" text-anchor="middle" class="ttl">devflow.service</text>
  <line x1="1" y1="31" x2="419" y2="31" stroke="#21262D"/>
  <g class="l1">
    <rect x="279" y="44" width="129" height="18" rx="3" fill="url(#tagBg3)"/>
    <text x="343" y="57" text-anchor="middle" class="tag">CI/CD · Full-Stack</text>
  </g>
  <g class="l1"><text x="18" y="57" class="name">DEVFLOW</text></g>
  <g class="l2"><line x1="18" y1="68" x2="402" y2="68" stroke="#21262D" stroke-width="1"/></g>
  <g class="l2"><text x="18" y="84" class="desc">Dev Operations &amp; Deployment Tracking Dashboard</text></g>
  <g class="l3"><text x="18" y="103"><tspan class="key">Deployments  </tspan><tspan class="val">→ Environment &amp; release tracking</tspan></text></g>
  <g class="l4"><text x="18" y="120"><tspan class="key">Real-Time    </tspan><tspan class="val">→ WebSocket-powered live status</tspan></text></g>
  <g class="l5"><text x="18" y="137"><tspan class="key">CI/CD        </tspan><tspan class="val">→ Pipeline visibility &amp; mgmt</tspan></text></g>
  <g class="l6"><text x="18" y="154"><tspan class="key">Backend      </tspan><tspan class="val">→ Spring Boot service layer</tspan></text></g>
  <g class="l7">
    <line x1="18" y1="172" x2="402" y2="172" stroke="#21262D" stroke-width="1"/>
    <text x="18" y="188" class="stack">Java · Spring Boot · React · WebSockets · Docker</text>
    <text x="18" y="208" class="grn">$ open</text>
    <text x="60" y="208" class="desc">github.com/A-R-K-7/DevFlow</text>
    <rect x="302" y="198" width="6" height="11" rx="1" class="cur blink"/>
  </g>
</svg>
