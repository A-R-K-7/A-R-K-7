<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="440" height="270" role="img" aria-label="FlatTradeWeb - Automated Sell-Side Trading System">
  <defs>
    <style>
      .bg     { fill: #0D1117; }
      .tb     { fill: #161B22; }
      .border { fill: none; stroke: #30363D; stroke-width: 1.5; }
      .dr     { fill: #FF5F56; }
      .dy     { fill: #FFBD2E; }
      .dg     { fill: #27C93F; }
      .ttl    { fill: #8B949E; font-family: 'Courier New', Courier, monospace; font-size: 12px; }
      .tag    { fill: #7EE787; font-family: 'Courier New', Courier, monospace; font-size: 11px; font-weight: bold; }
      .name   { fill: #E6EDF3; font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; letter-spacing: 2px; }
      .desc   { fill: #C9D1D9; font-family: 'Courier New', Courier, monospace; font-size: 13px; }
      .key    { fill: #58A6FF; font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: bold; }
      .val    { fill: #9BA3AC; font-family: 'Courier New', Courier, monospace; font-size: 12px; }
      .stack  { fill: #8B949E; font-family: 'Courier New', Courier, monospace; font-size: 11px; }
      .grn    { fill: #7EE787; font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: bold; }
      .cur    { fill: #7EE787; }
      .blink  { animation: blink 1s step-end infinite; }
      .l1  { opacity:0; animation: fi .25s .4s forwards; }
      .l2  { opacity:0; animation: fi .25s .7s forwards; }
      .l3  { opacity:0; animation: fi .25s 1.0s forwards; }
      .l4  { opacity:0; animation: fi .25s 1.3s forwards; }
      .l5  { opacity:0; animation: fi .25s 1.6s forwards; }
      .l6  { opacity:0; animation: fi .25s 1.9s forwards; }
      .l7  { opacity:0; animation: fi .25s 2.2s forwards; }
      @keyframes fi    { from { opacity:0; } to { opacity:1; } }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
    </style>
    <linearGradient id="tagBg6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="439" height="269" rx="8" class="bg"/>
  <rect x=".5" y=".5" width="439" height="269" rx="8" class="border"/>
  <rect x="1" y="1" width="438" height="34" rx="7" class="tb"/>
  <rect x="1" y="26" width="438" height="9" class="tb"/>
  <circle cx="20" cy="18" r="6" class="dr"/>
  <circle cx="38" cy="18" r="6" class="dy"/>
  <circle cx="56" cy="18" r="6" class="dg"/>
  <text x="219" y="22" text-anchor="middle" class="ttl">flattrade-automation.service</text>
  <line x1="1" y1="35" x2="439" y2="35" stroke="#21262D" stroke-width="1"/>

  <g class="l1">
    <rect x="286" y="48" width="132" height="20" rx="3" fill="url(#tagBg6)"/>
    <text x="352" y="63" text-anchor="middle" class="tag">Trading · Python</text>
  </g>
  <g class="l1"><text x="20" y="63" class="name">FLATTRADEWEB</text></g>
  <g class="l2"><line x1="20" y1="76" x2="420" y2="76" stroke="#30363D" stroke-width="1"/></g>
  <g class="l2"><text x="20" y="95" class="desc">Automated Sell-Side Trading via FlatTrade API</text></g>
  <g class="l3"><text x="20" y="118"><tspan class="key">Automation   </tspan><tspan class="val">→  Programmatic order execution</tspan></text></g>
  <g class="l4"><text x="20" y="138"><tspan class="key">API          </tspan><tspan class="val">→  FlatTrade brokerage connectivity</tspan></text></g>
  <g class="l5"><text x="20" y="158"><tspan class="key">Interface    </tspan><tspan class="val">→  Flask-based control dashboard</tspan></text></g>
  <g class="l6"><text x="20" y="178"><tspan class="key">Sell Engine  </tspan><tspan class="val">→  Rule-based sell automation</tspan></text></g>
  <g class="l7">
    <line x1="20" y1="196" x2="420" y2="196" stroke="#30363D" stroke-width="1"/>
    <text x="20" y="216" class="stack">Python · Flask · REST APIs</text>
    <text x="20" y="240" class="grn">$ open</text>
    <text x="72" y="240" class="desc">github.com/A-R-K-7/FlatTradeWeb</text>
    <rect x="360" y="229" width="7" height="13" rx="1" class="cur blink"/>
  </g>
</svg>
