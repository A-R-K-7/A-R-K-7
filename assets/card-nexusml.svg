<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-label="NexusML - AI Governance and MLOps Platform">
  <defs>
    <style>
      .bg     { fill: #0D1117; }
      .tb     { fill: #161B22; }
      .border { fill: none; stroke: #30363D; stroke-width: 1; }
      .dr     { fill: #FF5F56; }
      .dy     { fill: #FFBD2E; }
      .dg     { fill: #27C93F; }
      .ttl    { fill: #6E7681; font-family:'Courier New',monospace; font-size:11px; }
      .tag    { fill: #BC8CFF; font-family:'Courier New',monospace; font-size:10px; font-weight:bold; }
      .name   { fill: #F0F6FC; font-family:'Courier New',monospace; font-size:15px; font-weight:bold; letter-spacing:1px; }
      .desc   { fill: #8B949E; font-family:'Courier New',monospace; font-size:11px; }
      .key    { fill: #58A6FF; font-family:'Courier New',monospace; font-size:11px; }
      .val    { fill: #8B949E; font-family:'Courier New',monospace; font-size:11px; }
      .stack  { fill: #6E7681; font-family:'Courier New',monospace; font-size:10px; }
      .grn    { fill: #7EE787; font-family:'Courier New',monospace; font-size:11px; }
      .cur    { fill: #7EE787; }
      .blink  { animation: blink 1s step-end infinite; }
      .l1  { opacity:0; animation: fi .2s .4s forwards; }
      .l2  { opacity:0; animation: fi .2s .7s forwards; }
      .l3  { opacity:0; animation: fi .2s 1.0s forwards; }
      .l4  { opacity:0; animation: fi .2s 1.3s forwards; }
      .l5  { opacity:0; animation: fi .2s 1.6s forwards; }
      .l6  { opacity:0; animation: fi .2s 1.9s forwards; }
      .l7  { opacity:0; animation: fi .2s 2.2s forwards; }
      @keyframes fi    { from{opacity:0;} to{opacity:1;} }
      @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
    </style>
    <linearGradient id="tagBg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
  </defs>
  <!-- Card shell -->
  <rect x=".5" y=".5" width="419" height="239" rx="7" class="bg"/>
  <rect x=".5" y=".5" width="419" height="239" rx="7" class="border"/>
  <!-- Titlebar -->
  <rect x="1" y="1" width="418" height="30" rx="6" class="tb"/>
  <rect x="1" y="22" width="418" height="9"  class="tb"/>
  <!-- Traffic lights -->
  <circle cx="18" cy="16" r="5" class="dr"/>
  <circle cx="34" cy="16" r="5" class="dy"/>
  <circle cx="50" cy="16" r="5" class="dg"/>
  <text x="210" y="20" text-anchor="middle" class="ttl">nexusml.service</text>
  <line x1="1" y1="31" x2="419" y2="31" stroke="#21262D"/>
  <!-- Tag -->
  <g class="l1">
    <rect x="300" y="44" width="108" height="18" rx="3" fill="url(#tagBg1)"/>
    <text x="354" y="57" text-anchor="middle" class="tag">MLOps · AI</text>
  </g>
  <!-- Project name -->
  <g class="l1"><text x="18" y="57" class="name">NEXUSML</text></g>
  <!-- Divider -->
  <g class="l2"><line x1="18" y1="68" x2="402" y2="68" stroke="#21262D" stroke-width="1"/></g>
  <!-- Description -->
  <g class="l2"><text x="18" y="84" class="desc">AI Governance &amp; MLOps Platform</text></g>
  <!-- Features -->
  <g class="l3"><text x="18" y="103"><tspan class="key">ML Lifecycle </tspan><tspan class="val">→ End-to-end model management</tspan></text></g>
  <g class="l4"><text x="18" y="120"><tspan class="key">Registry     </tspan><tspan class="val">→ Versioning &amp; experiment tracking</tspan></text></g>
  <g class="l5"><text x="18" y="137"><tspan class="key">Deployment   </tspan><tspan class="val">→ Automated model serving</tspan></text></g>
  <g class="l6"><text x="18" y="154"><tspan class="key">Governance   </tspan><tspan class="val">→ Monitoring &amp; observability</tspan></text></g>
  <!-- Stack -->
  <g class="l7">
    <line x1="18" y1="172" x2="402" y2="172" stroke="#21262D" stroke-width="1"/>
    <text x="18" y="188" class="stack">Python · FastAPI · React · Node.js · MongoDB · Docker</text>
    <text x="18" y="208" class="grn">$ open</text>
    <text x="60" y="208" class="desc">github.com/A-R-K-7/NexusML</text>
    <rect x="342" y="198" width="6" height="11" rx="1" class="cur blink"/>
  </g>
</svg>
