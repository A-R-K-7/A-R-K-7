<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 100" width="860" height="100" role="img" aria-label="Terminal footer - Thanks for visiting">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .border { fill: none; stroke: #30363D; stroke-width: 1; }
      .muted { fill: #6E7681; font-family: 'Courier New', Courier, monospace; font-size: 11px; }
      .prompt { fill: #7EE787; font-family: 'Courier New', Courier, monospace; font-size: 12px; }
      .cmd { fill: #8B949E; font-family: 'Courier New', Courier, monospace; font-size: 12px; }
      .cursor { fill: #7EE787; }
      .blink { animation: blink 1s step-end infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
      .l1 { opacity: 0; animation: fadeIn 0.3s 0.3s forwards; }
      .l2 { opacity: 0; animation: fadeIn 0.3s 0.8s forwards; }
      .l3 { opacity: 0; animation: fadeIn 0.3s 1.3s forwards; }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="99" rx="6" ry="6" class="bg"/>
  <rect x="0.5" y="0.5" width="859" height="99" rx="6" ry="6" class="border"/>
  <g class="l1">
    <text x="28" y="36" class="muted">&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;</text>
  </g>
  <g class="l2">
    <text x="28" y="60" class="prompt">$</text>
    <text x="44" y="60" class="cmd">echo "Thanks for visiting."</text>
  </g>
  <g class="l3">
    <text x="28" y="80" class="muted">&gt;</text>
    <text x="44" y="80" class="cmd">Always building. Always learning.</text>
    <text x="380" y="80" class="prompt">$ exit 0</text>
    <rect x="440" y="69" width="7" height="12" rx="1" class="cursor blink"/>
  </g>
</svg>
